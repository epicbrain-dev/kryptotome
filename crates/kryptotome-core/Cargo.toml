[package]
name = "kryptotome-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core cryptographic primitives, data models, and zero-knowledge circuit interfaces for Kryptotome."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
chrono = { workspace = true }
ark-bls12-381 = { version = "0.6.0", features = ["std", "curve"] }
ark-ec = { version = "0.6.0", features = ["std"] }
ark-ff = { version = "0.6.0", features = ["std"] }
ark-std = { version = "0.6.0", features = ["std"] }
ark-serialize = { version = "0.6.0", features = ["derive"] }
