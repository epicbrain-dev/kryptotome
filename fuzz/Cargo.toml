[package]
name = "kryptotome-fuzz"
version = "0.1.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kryptotome-core = { path = "../crates/kryptotome-core" }
kryptotome-cli = { path = "../crates/kryptotome-cli" }
kryptotome-verifier = { path = "../crates/kryptotome-verifier" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "fuzz_target_manifest"
path = "fuzz_targets/fuzz_target_manifest.rs"
test = false
doc = false

[[bin]]
name = "fuzz_target_proof"
path = "fuzz_targets/fuzz_target_proof.rs"
test = false
doc = false

[[bin]]
name = "fuzz_target_bundle"
path = "fuzz_targets/fuzz_target_bundle.rs"
test = false
doc = false
